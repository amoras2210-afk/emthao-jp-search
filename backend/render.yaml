services:
  - type: web
    name: emthaojp-backend
    env: docker
    plan: free
    region: singapore
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: ALLOWED_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info
      # Render free is 0.1 CPU / 512 MB. Localhost finishes a scrape in 2-4s;
      # Render takes 8-15s under CPU contention. These two env values are tuned
      # for free-tier and exposed here so an ops bump to Starter (0.5 CPU)
      # can lower SCRAPER_TIMEOUT_MS back to 12000 + raise SCRAPE_CONCURRENCY.
      - key: SCRAPER_TIMEOUT_MS
        value: 25000
      # Dropped from 2 to 1 (2026-09-14): controlled A/B test proved Yahoo
      # degrades from 20 real results (LIVE, ~19s) to 0 results (DEGRADED, no
      # error) purely from running concurrently with Mercari on Render free's
      # 0.1 vCPU — same query, only difference was concurrency. Serializing
      # scrapers trades total /search latency for per-source reliability.
      # Does not touch Mercari's own separate failure (reproducible even
      # with concurrency=1, unrelated root cause — see diagnostic).
      - key: SCRAPE_CONCURRENCY
        value: 1
